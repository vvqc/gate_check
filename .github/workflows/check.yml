name: VPN Gate Node Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: read

concurrency:
  group: gate-check-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Check nodes and generate nodes.txt
        run: python vpngate.py
        env:
          EDGE_HOSTS: ${{ secrets.EDGE_HOSTS }}
          WORKER_DOMAIN: ${{ secrets.WORKER_DOMAIN }}
          NODES_GITHUB_USERNAME: ${{ secrets.NODES_GITHUB_USERNAME }}

      - name: Upload nodes for Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy nodes.txt
        id: deployment
        uses: actions/deploy-pages@v4
